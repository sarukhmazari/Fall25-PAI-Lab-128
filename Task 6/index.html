<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f4f4f9;
        }

        .container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.8rem;
        }

        button {
            background-color: #ff6b6b;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #ff3b3b;
        }

        .joke {
            margin-top: 25px;
            font-size: 1.2rem;
            color: #2c3e50;
            min-height: 60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random Joke Generator</h1>
        <button id="getJokeBtn">Get a Joke</button>
        <div class="joke" id="jokeDisplay"></div>
    </div>

    <script>
        const button = document.getElementById('getJokeBtn');
        const jokeDisplay = document.getElementById('jokeDisplay');

        button.addEventListener('click', async () => {
            jokeDisplay.textContent = "Fetching a joke...";
            try {
                const response = await fetch('/joke');
                if (!response.ok) throw new Error('Failed to fetch joke');
                const data = await response.json();
                if (data.error) {
                    jokeDisplay.textContent = data.error;
                } else {
                    jokeDisplay.innerHTML = `<strong>${data.setup}</strong><br>${data.punchline}`;
                }
            } catch (err) {
                jokeDisplay.textContent = "Error fetching joke: " + err.message;
            }
        });
    </script>
</body>
</html>
