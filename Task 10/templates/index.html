<!DOCTYPE html>
<html>
<head>
    <title>University Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>University Chatbot</h1>

        <form method="POST">
            <input type="text" name="message" placeholder="Ask something..." required>
            <button type="submit">Send</button>
        </form>

        {% if response %}
        <div class="box">
            <p>{{ response }}</p>
        </div>
        {% endif %}

    </div>

</body>
</html>
